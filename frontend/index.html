<!DOCTYPE html>
<html>
<head>
  <title>DevOps Dashboard</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #38bdf8;
    }

    .dashboard {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .create { background: #22c55e; }
    .status { background: #3b82f6; }
    .destroy { background: #ef4444; }
    .full { background: #8b5cf6; }

    button:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .status-card {
      text-align: left;
    }

    .label {
      color: #94a3b8;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>🚀 DevOps Infrastructure Dashboard</h1>

<div id="root"></div>

<script type="text/babel">

function App() {

  const [status, setStatus] = React.useState("Idle")

  const [infra, setInfra] = React.useState({
    ip: "",
    bucket: "",
    vpc: ""
  })

  const callAPI = async (url) => {
    const res = await fetch(url, { method: "POST" })
    const data = await res.json()

    setStatus(data.status)

    setInfra({
      ip: data.ip || "",
      bucket: data.bucket || "",
      vpc: data.vpc || ""
    })
  }

  const checkStatus = async () => {
    const res = await fetch("http://localhost:5000/status")
    const data = await res.json()

    setStatus(data.status)

    setInfra({
      ip: data.ip || "",
      bucket: data.bucket || "",
      vpc: data.vpc || ""
    })
  }

  return (
    <div className="dashboard">

      {/* VPC */}
      <div className="card">
        <div className="row">
          <div className="title">🌐 VPC</div>
          <div className="buttons">
            <button className="create" onClick={() => callAPI("http://localhost:5000/create-vpc")}>
              <i className="fas fa-network-wired"></i> Create
            </button>

            <button className="status" onClick={checkStatus}>
              <i className="fas fa-info-circle"></i> Status
            </button>

            <button className="destroy" onClick={() => callAPI("http://localhost:5000/destroy-all")}>
              <i className="fas fa-trash"></i> Destroy
            </button>
          </div>
        </div>
      </div>

      {/* S3 */}
      <div className="card">
        <div className="row">
          <div className="title">🪣 S3 Bucket</div>
          <div className="buttons">
            <button className="create" onClick={() => callAPI("http://localhost:5000/create-s3")}>
              <i className="fas fa-database"></i> Create
            </button>

            <button className="status" onClick={checkStatus}>
              <i className="fas fa-info-circle"></i> Status
            </button>

            <button className="destroy" onClick={() => callAPI("http://localhost:5000/destroy-all")}>
              <i className="fas fa-trash"></i> Destroy
            </button>
          </div>
        </div>
      </div>

      {/* EC2 */}
      <div className="card">
        <div className="row">
          <div className="title">🖥️ EC2 Instance</div>
          <div className="buttons">
            <button className="create" onClick={() => callAPI("http://localhost:5000/create-ec2")}>
              <i className="fas fa-server"></i> Create
            </button>

            <button className="status" onClick={checkStatus}>
              <i className="fas fa-info-circle"></i> Status
            </button>

            <button className="destroy" onClick={() => callAPI("http://localhost:5000/destroy-all")}>
              <i className="fas fa-trash"></i> Destroy
            </button>
          </div>
        </div>
      </div>

      {/* FULL INFRA */}
      <div className="card">
        <div className="row">
          <div className="title">⚡ Full Infrastructure</div>
          <div className="buttons">
            <button className="full" onClick={() => callAPI("http://localhost:5000/create-full")}>
              <i className="fas fa-bolt"></i> Deploy
            </button>

            <button className="status" onClick={checkStatus}>
              <i className="fas fa-info-circle"></i> Status
            </button>

            <button className="destroy" onClick={() => callAPI("http://localhost:5000/destroy-all")}>
              <i className="fas fa-trash"></i> Destroy
            </button>
          </div>
        </div>
      </div>

      {/* STATUS PANEL */}
      <div className="card status-card">
        <h2>Status: {status}</h2>

        <p><span className="label">EC2 IP:</span><br />{infra.ip || "N/A"}</p>
        <p><span className="label">S3 Bucket:</span><br />{infra.bucket || "N/A"}</p>
        <p><span className="label">VPC ID:</span><br />{infra.vpc || "N/A"}</p>
      </div>

    </div>
  )
}

const root = ReactDOM.createRoot(document.getElementById("root"))
root.render(<App />)

</script>

</body>
</html>
